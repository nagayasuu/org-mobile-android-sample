name: Android E2E

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Coverage comparison base (SHA or fetched ref)'
        required: true
        default: origin/main
        type: string

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check build comparison conditions before E2E
        env:
          COVERAGE_BASE_REF: ${{ inputs.base_ref }}
        run: python3 scripts/run_coverage.py --preflight-only --base-ref "$COVERAGE_BASE_REF"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Manual runs on work branches also retain AndroidTest dependencies.
          # GitHub scopes these writes to the branch; main can seed later branches.
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM for the runner
        run: |
          test -c /dev/kvm || { echo '::error::KVM device is missing'; exit 1; }
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Select SDK cache generation
        id: sdk-cache-generation
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache immutable SDK packages
        id: sdk-cache
        uses: actions/cache@v4
        with:
          # Do not cache AVDs, userdata, accounts, or device settings.
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-37.0
            ${{ env.ANDROID_HOME }}/build-tools/37.0.0
            ${{ env.ANDROID_HOME }}/system-images/android-37.0/google_apis/x86_64
          key: e2e-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk-cache-generation.outputs.month }}-${{ hashFiles('.github/workflows/e2e.yml') }}
      - name: Install SDK and full Google APIs image
        run: python3 scripts/run_check.py --output-dir app/build/reports/e2e/sdk -- sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' emulator 'system-images;android-37.0;google_apis;x86_64'
      - name: Run settings gate and E2E scenarios with phase timing
        run: python3 scripts/run_e2e.py --output-dir app/build/reports/e2e/run
      - name: Summarize phase timing
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print('| Phase | Status | Wall seconds |')
          print('| --- | --- | ---: |')
          for phase in ('sdk', 'run/preflight', 'run/suite'):
              path = Path('app/build/reports/e2e', phase, 'summary.json')
              if path.exists():
                  data = json.loads(path.read_text())
                  print(f"| {phase} | {data['status']} | {data['wall_seconds']} |")
              else:
                  print(f'| {phase} | not run | — |')
          PY
          echo 'SDK cache hit: ${{ steps.sdk-cache.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Record revision and APK identity
        if: always()
        run: |
          mkdir -p app/build/reports/e2e
          git rev-parse HEAD > app/build/reports/e2e/revision.txt
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/reports/e2e/apk-sha256.txt
          fi
      - name: Upload E2E reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-reports
          path: |
            app/build/reports/androidTests/
            app/build/reports/e2e/
            app/build/outputs/androidTest-results/
            app/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: warn
      - name: Upload tested APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: org-reader-e2e-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: warn
