name: Main CI email

on:
  workflow_run:
    workflows: [Android checks]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  notify:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send success email
        env:
          SMTP_HOST: ${{ secrets.MAIN_CI_SMTP_HOST }}
          SMTP_PORT: ${{ vars.MAIN_CI_SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.MAIN_CI_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.MAIN_CI_SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIN_CI_MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIN_CI_MAIL_TO }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          from email.errors import HeaderParseError
          from email.headerregistry import Address
          from email.message import EmailMessage

          required = ("SMTP_HOST", "SMTP_USERNAME", "SMTP_PASSWORD", "MAIL_FROM", "MAIL_TO")
          if any(not os.environ[name] for name in required):
              raise SystemExit("Configure the MAIN_CI_* SMTP and mail secrets before sending.")

          port = os.environ["SMTP_PORT"]
          if port not in ("465", "587"):
              raise SystemExit("MAIN_CI_SMTP_PORT must be 465 (implicit TLS) or 587 (STARTTLS).")

          message = EmailMessage()
          message["Subject"] = f"[{os.environ['GITHUB_REPOSITORY']}] main CI succeeded"
          try:
              message["From"] = Address(addr_spec=os.environ["MAIL_FROM"])
              message["To"] = Address(addr_spec=os.environ["MAIL_TO"])
          except (HeaderParseError, ValueError):
              raise SystemExit("Configure a single valid mailbox in MAIN_CI_MAIL_FROM and MAIN_CI_MAIL_TO.") from None
          message.set_content(
              f"Android checks succeeded on main.\n"
              f"Commit: {os.environ['CI_SHA']}\n"
              f"Run: {os.environ['CI_URL']}\n"
          )

          tls_context = ssl.create_default_context()
          host = os.environ["SMTP_HOST"]
          try:
              if port == "465":
                  connection = smtplib.SMTP_SSL(host, 465, timeout=30, context=tls_context)
              else:
                  connection = smtplib.SMTP(host, 587, timeout=30)
              with connection as smtp:
                  if port == "587":
                      smtp.starttls(context=tls_context)
                  smtp.login(os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"])
                  smtp.send_message(message)
          except (OSError, ValueError) as error:
              raise SystemExit(f"SMTP delivery failed ({type(error).__name__}).") from None
          PY
