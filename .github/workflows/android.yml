name: Android checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Kotlin declaration tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/setup-kotlin-tools.sh
      - name: Test Git tooling
        env:
          KOTLIN_GRAMMAR_LIBRARY: ${{ github.workspace }}/.local/kotlin-tools/kotlin.so
        run: .local/kotlin-tools/venv/bin/python -m unittest discover -s scripts/tests -v
      - name: Check commit messages and PR title
        run: python3 scripts/check_commit_message.py --github-event "$GITHUB_EVENT_PATH"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Build, lint, test and verify coverage
        run: python3 scripts/run_coverage.py --github-event "$GITHUB_EVENT_PATH"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: org-reader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: app/build/reports/
          if-no-files-found: warn
